  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    input, textarea, select { user-select: auto !important; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-bebas { font-family: 'Bebas Neue', cursive; }
    .font-teko { font-family: 'Teko', sans-serif; }

    @keyframes clue-zoom-in {
      0% { opacity: 0; transform: scale(0.7) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-clue-zoom { animation: clue-zoom-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes pop-number {
      0% { transform: scale(0.4); opacity: 0; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop-number { animation: pop-number 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .tv-studio-frame {
      background: linear-gradient(165deg, #2b354d 0%, #131b2e 30%, #080d1a 70%, #030612 100%);
      border: 4px solid #475569;
      box-shadow: 
        0 0 0 2px #d4af37,
        0 0 0 5px #1e293b,
        0 25px 60px rgba(0, 0, 0, 0.9),
        0 0 50px rgba(6, 12, 233, 0.3);
    }

    .buzzer-dome-red {
      background: radial-gradient(circle at 36% 28%, #ff8a8a 0%, #ef4444 35%, #b91c1c 70%, #7f1d1d 95%, #450a0a 100%);
      box-shadow: 0 14px 0 #5c0e0e, 0 20px 30px rgba(0, 0, 0, 0.9), 0 0 35px rgba(239, 68, 68, 0.6);
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .buzzer-dome-red:active {
      transform: translateY(10px) scale(0.98);
      box-shadow: 0 4px 0 #5c0e0e, 0 8px 18px rgba(0, 0, 0, 0.9);
    }

    .buzzer-disabled {
      background: radial-gradient(circle at 36% 28%, #64748b 0%, #475569 50%, #1e293b 100%) !important;
      box-shadow: 0 8px 0 #0f172a, 0 10px 20px rgba(0, 0, 0, 0.6) !important;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    .glossy-clue-card {
      position: relative;
      overflow: hidden;
      transition: all 0.15s ease;
    }
    .glossy-clue-card:hover {
      transform: scale(1.03);
      filter: brightness(1.15);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
    }

    .answered-card {
      background: #02061f !important;
      border-color: #0c163b !important;
      cursor: not-allowed !important;
      opacity: 0.25 !important;
    }
  </style>
</head>

    (function() {

      class SoundSynthesizer {
        constructor() { this.ctx = null; }
        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        }
        playTick() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.09);
        }
        playSelect() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587, now);
          osc.frequency.exponentialRampToValueAtTime(1174, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.1);
        }
        playClueOpen() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [233, 293, 349, 466, 587, 700].forEach((freq, idx) => {
            const st = now + idx * 0.05;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, st);
            gain.gain.setValueAtTime(0.2, st);
            gain.gain.exponentialRampToValueAtTime(0.001, st + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(st); osc.stop(st + 0.32);
          });
        }
        playBuzz() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [1046, 1567, 2093].forEach(freq => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.62);
          });
        }
        playCorrect() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523, 659, 783, 1046].forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(f, now + i * 0.05);
            gain.gain.setValueAtTime(0.2, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.32);
          });
        }
        playWrong() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [98, 138].forEach(f => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.32);
          });
        }
      }
      const sound = new SoundSynthesizer();
      window.addEventListener('pointerdown', () => sound.init(), { passive: true });

      function getDefaultState() {
        return {
          roomCode: 'EN VIVO',
          status: 'setup',
          title: 'Torneo Jeopardy Live Show',
          categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
          teamCount: 3,
          maxMembersPerTeam: 5,
          teams: JSON.parse(JSON.stringify(DEFAULT_TEAMS_TEMPLATE.slice(0, 3))),
          activeClue: null,
          currentTurn: null,
          buzzQueue: [],
          disqualifiedTeams: [],
          buzzersUnlocked: false,
          countdownValue: null,
          falseStart: false,
          lastUpdated: Date.now()
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return getDefaultState();
      }

      let state = loadState();

      const urlParams = new URLSearchParams(window.location.search);
      let assignedTeamId = urlParams.get('team') || null;
      let currentRole = (urlParams.get('role') === 'player' || assignedTeamId !== null) ? 'player' : 'host';

      if (currentRole === 'host') state.status = 'setup';

      // Credenciales Firebase
      const _k1 = "AIzaSyDaeedSq8IQ";
      const _k2 = "NifS3DutUGm4jRJmANmhBSE";
      const firebaseConfig = {
        apiKey: _k1 + _k2,
        authDomain: "jeopardyjrh.firebaseapp.com",
        databaseURL: "https://jeopardyjrh-default-rtdb.firebaseio.com",
        projectId: "jeopardyjrh",
        storageBucket: "jeopardyjrh.firebasestorage.app",
        messagingSenderId: "299331613996",
        appId: "1:299331613996:web:a4667fcebc645394dbe889"
      };

      let fbDb = null;
      let serverTimeOffset = 0;

      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        fbDb = firebase.database();
        setupFirebaseSync();
      } catch (err) {
        console.warn('Firebase error:', err);
      }

      function getEstimatedServerTime() {
        return Date.now() + serverTimeOffset;
      }

      function setupFirebaseSync() {
        if (!fbDb) return;

        fbDb.ref('.info/serverTimeOffset').on('value', (snap) => {
          serverTimeOffset = snap.val() || 0;
        });

        fbDb.ref('sessions/jeopardy_game/globalReset').on('value', (snap) => {
          if (snap.val() === true) {
            fbDb.ref('sessions/jeopardy_game/globalReset').remove();
            localStorage.clear();
            sessionStorage.clear();
            location.reload();
          }
        });

        fbDb.ref('jeopardy_game/teams').on('value', (snap) => {
          const val = snap.val() || {};
          state.teams.forEach(team => {
            const tData = val[team.id];
            if (tData && tData.players) {
              team.members = Object.values(tData.players);
            } else {
              team.members = [];
            }
          });
          updateLiveParticipantsDOM();
        });

        fbDb.ref('sessions/jeopardy_game').on('value', (snap) => {
          const session = snap.val() || {};
          const prevTurn = state.currentTurn;
          const prevUnlocked = state.buzzersUnlocked;

          state.activeClue = session.activeClue || null;
          state.currentTurn = session.activeTurn || null;
          state.buzzQueue = session.buzzQueue ? Object.values(session.buzzQueue).sort((a,b) => a.timestamp - b.timestamp) : [];
          state.disqualifiedTeams = session.disqualifiedTeams || [];
          state.buzzersUnlocked = Boolean(session.buzzersUnlocked);
          state.falseStart = Boolean(session.falseStart);
          if (session.status) state.status = session.status;

          if (!prevUnlocked && state.buzzersUnlocked && currentRole === 'player') {
            sound.playSelect();
          }

          if (state.currentTurn && (!prevTurn || prevTurn.playerId !== state.currentTurn.playerId) && currentRole === 'host') {
            sound.playBuzz();
          }

          render();
        });
      }

      function updateLiveParticipantsDOM() {
        if (currentRole !== 'host') return;
        const activeTeams = state.teams.slice(0, state.teamCount);
        let total = 0;

        activeTeams.forEach(team => {
          const membersList = team.members ? (Array.isArray(team.members) ? team.members : Object.values(team.members)) : [];
          const count = membersList.length;
          total += count;

          ['setup', 'qr'].forEach(prefix => {
            const countEl = document.getElementById(`${prefix}-team-count-${team.id}`);
            if (countEl) countEl.textContent = `${count} / ${state.maxMembersPerTeam} registrados`;

            const listEl = document.getElementById(`${prefix}-team-members-${team.id}`);
            if (listEl) {
              if (count === 0) {
                listEl.innerHTML = `<span class="text-[10px] text-blue-400/60 italic py-1 block text-center">Esperando...</span>`;
              } else {
                listEl.innerHTML = membersList.map(m => `
                  <div class="text-xs font-semibold text-gray-200 flex justify-between items-center py-0.5 border-b border-gray-800/50">
                    <span class="truncate">${escapeHtml(m.name)}</span>
                    <span class="text-green-400 text-[10px]">● Conectado</span>
                  </div>
                `).join('');
              }
            }
          });
        });

        const totalSetup = document.getElementById('setup-total-connected-count');
        if (totalSetup) totalSetup.textContent = `${total} Conectados`;
        const totalQr = document.getElementById('qr-total-connected-count');
        if (totalQr) totalQr.textContent = String(total);
      }

      let countdownInterval = null;

      function openClue(catId, clueId) {
        const cat = state.categories.find(c => c.id === catId);
        const clue = cat?.clues.find(cl => cl.id === clueId);
        if (!clue || clue.isAnswered) return;

        if (countdownInterval) clearInterval(countdownInterval);

        state.activeClue = { ...clue, categoryTitle: cat.title, catId: cat.id };
        state.countdownValue = 10;
        state.currentTurn = null;
        state.buzzQueue = [];
        state.disqualifiedTeams = [];
        state.buzzersUnlocked = true;
        state.falseStart = false;

        sound.playTick();

        if (fbDb) {
          fbDb.ref('sessions/jeopardy_game').update({
            activeClue: state.activeClue,
            activeTurn: null,
            buzzQueue: null,
            disqualifiedTeams: null,
            buzzersUnlocked: true,
            falseStart: false
          });
        }
        render();

        countdownInterval = setInterval(() => {
          if (state.falseStart) {
            clearInterval(countdownInterval);
            countdownInterval = null;
            return;
          }

          state.countdownValue--;
          if (state.countdownValue > 0) {
            sound.playTick();
            render();
          } else {
            clearInterval(countdownInterval);
            countdownInterval = null;
            state.countdownValue = null;
            sound.playClueOpen();
            render();
          }
        }, 1000);

        persistState(state);
      }

      function handleAnswerEvaluation(isCorrect) {
        if (!state.activeClue || !state.currentTurn) return;

        const currentTurn = state.currentTurn;
        const clueVal = state.activeClue.value;
        const team = state.teams.find(t => t.id === currentTurn.teamId);

        if (isCorrect) {
          if (team) team.score += clueVal;
          sound.playCorrect();
          if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });

          const cat = state.categories.find(c => c.id === state.activeClue.catId);
          const cl = cat?.clues.find(x => x.id === state.activeClue.id);
          if (cl) cl.isAnswered = true;

          state.activeClue = null;
          state.countdownValue = null;
          state.currentTurn = null;
          state.buzzQueue = [];
          state.disqualifiedTeams = [];
          state.buzzersUnlocked = false;
          state.falseStart = false;

          if (fbDb) {
            fbDb.ref('jeopardy_game/teams').set(state.teams);
            fbDb.ref('sessions/jeopardy_game').update({
              activeClue: null,
              activeTurn: null,
              buzzQueue: null,
              disqualifiedTeams: null,
              buzzersUnlocked: false,
              falseStart: false
            });
          }
          persistState(state);
        } else {
          if (team) team.score -= clueVal;
          sound.playWrong();

          const disq = [...(state.disqualifiedTeams || [])];
          if (!disq.includes(currentTurn.teamId)) disq.push(currentTurn.teamId);
          state.disqualifiedTeams = disq;

          const remainingQueue = (state.buzzQueue || []).filter(item => !disq.includes(item.teamId));

          if (state.falseStart) {
            state.activeClue = null;
            state.countdownValue = null;
            state.currentTurn = null;
            state.buzzQueue = [];
            state.buzzersUnlocked = false;
            state.falseStart = false;

            const cat = state.categories.find(c => c.id === state.activeClue?.catId);
            const cl = cat?.clues.find(x => x.id === state.activeClue?.id);
            if (cl) cl.isAnswered = true;

            if (fbDb) {
              fbDb.ref('jeopardy_game/teams').set(state.teams);
              fbDb.ref('sessions/jeopardy_game').update({
                activeClue: null,
                activeTurn: null,
                buzzQueue: null,
                disqualifiedTeams: null,
                buzzersUnlocked: false,
                falseStart: false
              });
            }
          } else if (remainingQueue.length > 0) {
            const nextTurn = remainingQueue.shift();
            state.currentTurn = nextTurn;
            state.buzzQueue = remainingQueue;

            if (fbDb) {
              fbDb.ref('jeopardy_game/teams').set(state.teams);
              fbDb.ref('sessions/jeopardy_game/activeTurn').set(nextTurn);
              fbDb.ref('sessions/jeopardy_game/buzzQueue').set(remainingQueue);
              fbDb.ref('sessions/jeopardy_game/disqualifiedTeams').set(disq);
            }
          } else {
            state.currentTurn = null;
            state.buzzQueue = [];

            if (fbDb) {
              fbDb.ref('jeopardy_game/teams').set(state.teams);
              fbDb.ref('sessions/jeopardy_game/activeTurn').remove();
              fbDb.ref('sessions/jeopardy_game/buzzQueue').remove();
              fbDb.ref('sessions/jeopardy_game/disqualifiedTeams').set(disq);
              fbDb.ref('sessions/jeopardy_game/buzzersUnlocked').set(true);
            }
          }
          persistState(state);
        }
      }

      function cancelActiveClue() {
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
        if (!state.activeClue) return;

      function handleCSVUpload(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const text = e.target.result;
          const lines = text.split(/\r\n|\n/).filter(line => line.trim().length > 0);
          if (lines.length < 2) {
            alert("El archivo CSV no contiene suficientes filas.");
            return;
          }

          const delimiter = lines[0].includes(';') ? ';' : ',';
          const newCategoriesMap = {};

          for (let i = 1; i < lines.length; i++) {
            const parts = parseCSVLine(lines[i], delimiter);
            if (parts.length >= 4) {
              const catName = parts[0].trim();
              const val = parseInt(parts[1].trim().replace(/[^0-9]/g, ''), 10) || 100;
              const q = parts[2].trim();
              const a = parts[3].trim();

              if (!newCategoriesMap[catName]) newCategoriesMap[catName] = [];
              newCategoriesMap[catName].push({
                id: `c-upload-${i}`,
                value: val,
                question: q,
                answer: a,
                isAnswered: false
              });
            }
          }

          const catKeys = Object.keys(newCategoriesMap);
          if (catKeys.length === 0) {
            alert("No se pudieron extraer categorías del archivo.");
            return;
          }

          state.categories = catKeys.slice(0, 5).map((catName, idx) => ({
            id: `cat-up-${idx + 1}`,
            title: catName,
            clues: newCategoriesMap[catName].sort((a, b) => a.value - b.value).slice(0, 5)
          }));

          persistState(state);
          sound.playCorrect();
          alert(`¡Preguntas cargadas con éxito! ${state.categories.length} categorías registradas.`);
        };
        reader.readAsText(file, 'UTF-8');
      }

      function parseCSVLine(text, delimiter) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (c === '"') inQuotes = !inQuotes;
          else if (c === delimiter && !inQuotes) { result.push(cur); cur = ''; }
          else cur += c;
        }
        result.push(cur);
        return result;
      }

      function persistState(newState) {
        newState.lastUpdated = Date.now();
        state = newState;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        if (fbDb && currentRole === 'host') {
          fbDb.ref('sessions/jeopardy_game/status').set(newState.status);
        }
        render();
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

        }

        renderGameScreen(app);
      }

                        <span class="text-sm font-black tracking-widest text-[#FFCC00] uppercase font-cinzel">¡Pulsadores listos! La pregunta aparece en:</span>
                        <div key="${state.countdownValue}" class="animate-pop-number text-9xl sm:text-[150px] font-black text-white font-cinzel drop-shadow-[0_0_35px_rgba(255,204,0,0.8)]">
                          ${state.countdownValue}
                        </div>
                        <span class="text-xs text-emerald-400 font-bold uppercase tracking-wider animate-pulse">● Teléfonos activados y en espera</span>
                        <div class="bg-amber-500/20 border-2 border-amber-400 text-amber-300 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold uppercase tracking-wide mt-2">
                          ⚠️ De oprimir el botón antes de leer la pregunta la respuesta se dará por incorrecta.
                        </div>
                      `}
                    </div>
                  ` : `
                    <!-- PREGUNTA REVELADA Y TIMBRES ACTIVOS -->
                    <div class="my-4">
                      <p class="text-2xl sm:text-4xl font-black text-white leading-relaxed">
                        "${state.activeClue.question}"
                      </p>
                    </div>

                    <div class="w-full bg-[#000324] border-2 ${state.currentTurn ? 'border-emerald-400' : 'border-blue-700'} rounded-2xl p-4">
                      ${state.currentTurn ? `
                        <div class="space-y-1">
                          <span class="text-xs uppercase tracking-widest text-emerald-400 font-black animate-pulse">¡TIENE EL TURNO PARA RESPONDER!</span>
                          <h3 class="text-3xl font-black text-white uppercase">${state.currentTurn.playerName}</h3>
                          <span class="text-sm font-bold uppercase" style="color: ${state.currentTurn.teamColor}">Equipo: ${state.currentTurn.teamName}</span>
                        </div>
                      ` : `
                        <div class="flex items-center justify-center gap-2 text-emerald-300 font-bold text-sm">
                          <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
                          <span>TIMBRES ACTIVOS: ¡Cualquiera puede pulsar ahora!</span>
                        </div>
                      `}
                    </div>

                    ${(state.buzzQueue && state.buzzQueue.length > 0) ? `
                      <div class="w-full bg-[#00021A] rounded-xl p-3 border border-blue-900 text-left">
                        <span class="text-[11px] font-black uppercase text-[#FFCC00] block mb-1 font-cinzel">Fila de espera:</span>
                        <div class="flex flex-wrap gap-2">
                          ${state.buzzQueue.map((item, idx) => `
                            <div class="px-2.5 py-1 rounded bg-blue-950 border text-xs font-bold flex items-center gap-1.5" style="border-color: ${item.teamColor}">
                              <span class="text-slate-400 font-mono">#${idx + 2}</span>
                              <span class="text-white">${item.playerName}</span>
                              <span class="text-[10px] uppercase font-bold" style="color: ${item.teamColor}">(${item.teamName})</span>
                            </div>
                          `).join('')}
                        </div>
                      </div>
                    ` : ''}

                    ${(state.disqualifiedTeams && state.disqualifiedTeams.length > 0) ? `
                      <div class="text-xs text-rose-400 font-bold">
                        Equipos con fallo previo: ${state.disqualifiedTeams.map(id => id.toUpperCase()).join(', ')}
                      </div>
                    ` : ''}
                  `}

                  <!-- BOTONES DE CONTROL DEL PRESENTADOR -->
                  <div class="flex flex-wrap items-center justify-center gap-4 w-full pt-4">
                    ${(state.countdownValue === null && state.currentTurn) ? `
                      <button id="btn-mark-correct" class="px-6 py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-black text-sm uppercase shadow">
                        ✓ Correcto (+$${state.activeClue.value})
                      </button>
                      <button id="btn-mark-wrong" class="px-6 py-3.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-black text-sm uppercase shadow">
                        ✗ Incorrecto (-$${state.activeClue.value}) y Pasar Turno
                      </button>
                    ` : ''}
                    ${(state.falseStart && state.currentTurn) ? `
                      <button id="btn-apply-false-start" class="px-6 py-3.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-black text-sm uppercase shadow">
                        Aplicar Penalización (-$${state.activeClue.value}) y Cerrar Pregunta ✗
                      </button>
                    ` : ''}
                    <button id="btn-cancel-clue" class="px-6 py-3.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl font-bold text-sm uppercase">
                      Cerrar Pregunta
                    </button>
                  </div>

                </div>
              </div>
            ` : ''}

          </div>
        `;

        document.getElementById('btn-finish-game').addEventListener('click', () => {
          sound.playCorrect();
          state.status = 'podium_teams';
          persistState(state);
        });
        document.getElementById('btn-view-qrcodes').addEventListener('click', () => { sound.playSelect(); state.status = 'qrcodes'; persistState(state); });
        document.getElementById('btn-game-setup').addEventListener('click', () => { sound.playSelect(); state.status = 'setup'; persistState(state); });
        document.getElementById('btn-game-reset').addEventListener('click', executeResetBoard);
        document.getElementById('btn-game-logout').addEventListener('click', executeGlobalLogout);

        document.querySelectorAll('.clue-btn').forEach(b => {
          b.addEventListener('click', () => {
            openClue(b.getAttribute('data-cat'), b.getAttribute('data-clue'));
          });
        });

        if (state.activeClue) {
          document.getElementById('btn-cancel-clue')?.addEventListener('click', cancelActiveClue);
          document.getElementById('btn-mark-correct')?.addEventListener('click', () => handleAnswerEvaluation(true));
          document.getElementById('btn-mark-wrong')?.addEventListener('click', () => handleAnswerEvaluation(false));
          document.getElementById('btn-apply-false-start')?.addEventListener('click', () => {
            const clueVal = state.activeClue.value;
            const team = state.teams.find(t => t.id === state.currentTurn.teamId);
            if (team) team.score -= clueVal;
            sound.playWrong();

            const cat = state.categories.find(c => c.id === state.activeClue.catId);
            const cl = cat?.clues.find(x => x.id === state.activeClue.id);
            if (cl) cl.isAnswered = true;

            state.activeClue = null;
            state.countdownValue = null;
            state.currentTurn = null;
            state.buzzQueue = [];
            state.disqualifiedTeams = [];
            state.buzzersUnlocked = false;
            state.falseStart = false;

            if (fbDb) {
              fbDb.ref('jeopardy_game/teams').set(state.teams);
              fbDb.ref('sessions/jeopardy_game').update({
                activeClue: null,
                activeTurn: null,
                buzzQueue: null,
                disqualifiedTeams: null,
                buzzersUnlocked: false,
                falseStart: false
              });
            }
            persistState(state);
          });
        }
      }

      // 4. PANTALLA DE PODIUM DE EQUIPOS GANADORES
      function renderPodiumTeamsScreen(container) {
        const activeTeams = [...state.teams.slice(0, state.teamCount)].sort((a, b) => b.score - a.score);
        const winner = activeTeams[0];
        if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 90, origin: { y: 0.5 } });

        container.innerHTML = `
          <div class="min-h-screen bg-[#000533] p-6 flex flex-col justify-between items-center text-center">
            <header class="w-full max-w-4xl flex justify-between items-center bg-[#000222] border-2 border-[#D4AF37] rounded-2xl p-4">
              <h1 class="text-xl font-black text-[#FFCC00] uppercase font-cinzel">🏆 PODIUM DE EQUIPOS GANADORES 🏆</h1>
              <button id="btn-logout-podium-teams" class="px-3.5 py-1.5 bg-rose-600 rounded-xl text-xs font-bold uppercase hover:bg-rose-500">Cerrar Sesión</button>
            </header>

            <main class="my-auto max-w-4xl w-full space-y-6">
              <div class="p-6 rounded-3xl bg-gradient-to-b from-[#0e17fa]/40 to-[#03068e]/40 border-4 border-[#FFCC00] shadow-[0_0_50px_rgba(255,204,0,0.4)]">
                <span class="text-sm font-black uppercase text-[#FFCC00] font-cinzel tracking-widest">¡EQUIPO CAMPEÓN!</span>
                <h2 class="text-5xl sm:text-7xl font-black text-white uppercase font-cinzel my-2" style="color: ${winner.color}">${winner.name}</h2>
                <span class="text-3xl font-mono font-bold text-emerald-400">$${winner.score}</span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                ${activeTeams.map((t, idx) => `
                  <div class="p-4 rounded-2xl border-2 bg-[#000428] flex flex-col items-center justify-center" style="border-color: ${t.color}">
                    <span class="text-xs font-bold text-slate-400">#${idx + 1} Lugar</span>
                    <span class="text-lg font-black uppercase text-white truncate w-full">${t.name}</span>                     <span class="text-xl font-mono font-bold text-[#FFCC00]">$${t.score}</span>
                  </div>
                `).join('')}
              </div>
            </main>

            <footer class="w-full max-w-4xl flex justify-end">
              <button id="btn-next-podium" class="px-8 py-3.5 bg-[#FFCC00] text-[#000533] rounded-2xl font-black text-base uppercase hover:bg-yellow-400 shadow-lg">
                Siguiente (Podium Individual) ▶
              </button>
            </footer>
          </div>
        `;

        document.getElementById('btn-logout-podium-teams').addEventListener('click', executeGlobalLogout);
        document.getElementById('btn-next-podium').addEventListener('click', () => {
          sound.playSelect();
          state.status = 'podium_individuals';
          persistState(state);
        });
      }

      // 5. PANTALLA DE PODIUM DE INDIVIDUALES (TRES PRIMEROS LUGARES GENERALES)
      function renderPodiumIndividualsScreen(container) {
        let allPlayers = [];
        state.teams.slice(0, state.teamCount).forEach(team => {
          const membersList = team.members ? (Array.isArray(team.members) ? team.members : Object.values(team.members)) : [];
          if (membersList.length > 0) {
            membersList.forEach(m => {
              allPlayers.push({
                name: m.name || 'Participante',
                teamName: team.name,
                teamColor: team.color,
                score: team.score
              });
            });
          }
        });

        allPlayers.sort((a, b) => b.score - a.score);
        const topThree = allPlayers.slice(0, 3);
        if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });

        container.innerHTML = `
          <div class="min-h-screen bg-[#000533] p-6 flex flex-col justify-between items-center text-center">
            <header class="w-full max-w-4xl flex justify-between items-center bg-[#000222] border-2 border-[#D4AF37] rounded-2xl p-4">
              <h1 class="text-xl font-black text-[#FFCC00] uppercase font-cinzel">🌟 TRES PRIMEROS LUGARES GENERALES 🌟</h1>
              <button id="btn-logout-podium-ind" class="px-3.5 py-1.5 bg-rose-600 rounded-xl text-xs font-bold uppercase hover:bg-rose-500">Cerrar Sesión</button>
            </header>

            <main class="my-auto max-w-4xl w-full space-y-4">
              ${topThree.length === 0 ? `
                <div class="text-blue-300 text-base">No hay participantes registrados en los equipos.</div>
              ` : `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  ${topThree.map((p, idx) => `
                    <div class="p-6 rounded-3xl border-4 bg-[#000428] flex flex-col items-center justify-center shadow-xl relative overflow-hidden" style="border-color: ${idx === 0 ? '#FFCC00' : (idx === 1 ? '#94A3B8' : '#B45309')}">
                      <span class="text-xs font-black uppercase px-3 py-1 rounded-full mb-3" style="background-color: ${idx === 0 ? '#FFCC00' : (idx === 1 ? '#94A3B8' : '#B45309')}; color: #000533;">
                        ${idx === 0 ? '🥇 1er Lugar' : (idx === 1 ? '🥈 2do Lugar' : '🥉 3er Lugar')}
                      </span>
                      <h3 class="text-2xl font-black text-white uppercase truncate w-full mb-1">${escapeHtml(p.name)}</h3>
                      <span class="text-xs font-bold uppercase mb-3" style="color: ${p.teamColor}">Equipo: ${p.teamName}</span>
                      <span class="text-3xl font-mono font-bold text-emerald-400">$${p.score}</span>
                    </div>
                  `).join('')}
                </div>
              `}
            </main>

            <footer class="w-full max-w-4xl flex justify-center pt-2">
              <button id="btn-final-logout" class="px-8 py-3.5 bg-rose-600 text-white rounded-2xl font-black text-sm uppercase hover:bg-rose-500 shadow-lg">
                Cerrar Sesión Global y Finalizar ⏻
              </button>
            </footer>
          </div>
        `;

        document.getElementById('btn-logout-podium-ind').addEventListener('click', executeGlobalLogout);
        document.getElementById('btn-final-logout').addEventListener('click', executeGlobalLogout);
      }

      // 6. VISTA MÓVIL DEL PARTICIPANTE
      function renderPlayerView(container) {
        let myTeamId = assignedTeamId || localStorage.getItem('jeopardy_player_team') || 'azul';
        let myName = localStorage.getItem('jeopardy_player_name') || '';
        let myId = localStorage.getItem('jeopardy_player_id') || '';

        if (!myName) {
          container.innerHTML = `
            <div class="min-h-screen bg-[#000533] p-4 flex items-center justify-center">
              <div class="w-full max-w-sm bg-[#000842] border-4 border-[#FFCC00] rounded-3xl p-6 text-center space-y-4">
                <div class="w-16 h-16 mx-auto rounded-2xl bg-[#060CE9] border-2 border-[#FFCC00] flex items-center justify-center font-cinzel text-3xl font-black text-[#FFCC00]">J!</div>
                <h2 class="text-xl font-black text-white uppercase font-cinzel">Registro de Concursante</h2>
                <div class="p-2.5 rounded-xl bg-blue-950 border border-blue-600">
                  <span class="text-xs uppercase text-blue-300 font-bold">Equipo:</span>
                  <span class="text-base font-black text-[#FFCC00] uppercase block">${myTeamId}</span>
                </div>
                <form id="mobile-join-form" class="space-y-4 text-left">
                  <div>
                    <label class="block text-xs font-bold text-blue-200 mb-1">Tu Nombre:</label>
                    <input id="mobile-name" type="text" required placeholder="Escribe tu nombre..." class="w-full p-3.5 rounded-xl bg-[#000324] border-2 border-blue-500 text-white font-bold" />
                  </div>
                  <button type="submit" class="w-full py-3.5 bg-[#FFCC00] text-[#000533] font-black uppercase rounded-xl hover:bg-yellow-400">Entrar al Juego</button>
                </form>
              </div>
            </div>
          `;

          document.getElementById('mobile-join-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('mobile-name').value.trim();
            if (!name) return;
            const pId = 'p-' + Date.now();

            localStorage.setItem('jeopardy_player_name', name);
            localStorage.setItem('jeopardy_player_team', myTeamId);
            localStorage.setItem('jeopardy_player_id', pId);

            if (fbDb) {
              const pData = { id: pId, name: name, timestamp: Date.now() };
              fbDb.ref(`jeopardy_game/teams/${myTeamId}/players/${pId}`).set(pData);
            }
            sound.playSelect();
            render();
          });
          return;
        }

        if (state.status === 'podium_teams' || state.status === 'podium_individuals') {
          container.innerHTML = `
            <div class="min-h-screen bg-[#000533] p-6 flex flex-col justify-center items-center text-center space-y-4">
              <div class="w-20 h-20 rounded-2xl bg-[#060CE9] border-2 border-[#FFCC00] flex items-center justify-center font-cinzel text-4xl font-black text-[#FFCC00] shadow-lg">🏆</div>
              <h2 class="text-2xl font-black text-[#FFCC00] uppercase font-cinzel">¡Juego Finalizado!</h2>
              <p class="text-sm text-blue-200">Consulta los resultados y podium en la pantalla principal del profesor.</p>
              <button onclick="localStorage.clear();location.reload();" class="mt-6 px-6 py-3 bg-blue-900 border border-blue-500 rounded-xl text-xs font-bold uppercase text-white">Salir de la Sesión</button>
            </div>
          `;
          return;
        }

        const isDisqualified = (state.disqualifiedTeams || []).includes(myTeamId);
        const didIWin = state.currentTurn?.playerId === myId;
        const someoneFromMyTeamInQueue = (state.currentTurn?.teamId === myTeamId) || 
          (state.buzzQueue || []).some(q => q.teamId === myTeamId);

        const isBuzzerOpen = state.activeClue !== null && state.buzzersUnlocked && !isDisqualified && !someoneFromMyTeamInQueue;

        let statusMessage = "Esperando pregunta en el tablero...";
        if (state.falseStart && didIWin) {
          statusMessage = "¡TE ADELANTASTE! RESPUESTA INCORRECTA AUTOMÁTICA";
        } else if (didIWin) {
          statusMessage = "¡TIENES EL TURNO! RESPONDE EN VOZ ALTA";
        } else if (someoneFromMyTeamInQueue) {
          statusMessage = "¡Tu equipo ya pulsó el botón! Esperando respuesta...";
        } else if (isDisqualified) {
          statusMessage = "Tu equipo falló esta pregunta. Bloqueado en esta ronda.";
        } else if (isBuzzerOpen) {
          statusMessage = "● ¡TIMBRE LIBRE! ¡PULSA AHORA!";
        }

        container.innerHTML = `
          <div class="min-h-screen bg-[#000533] p-4 flex flex-col justify-between items-center text-center">
            <div class="pt-4 space-y-1">
              <span class="text-xs uppercase font-bold text-blue-300 block">Equipo: <strong class="text-white">${myTeamId.toUpperCase()}</strong></span>
              <span class="text-lg font-black text-[#FFCC00] block">${myName}</span>
              <span class="text-xs font-black uppercase block ${
                state.falseStart && didIWin ? 'text-rose-400 animate-pulse' :
                (didIWin ? 'text-emerald-400 animate-bounce' : 
                (isBuzzerOpen ? 'text-emerald-400' : (isDisqualified ? 'text-rose-400' : 'text-blue-300')))
              }">${statusMessage}</span>
            </div>

            <div class="my-auto py-6">
              <button
                id="mobile-buzzer-btn"
                ${!isBuzzerOpen ? 'disabled' : ''}
                class="w-64 h-64 rounded-full ${isBuzzerOpen ? 'buzzer-dome-red border-4 border-yellow-300 active:scale-95' : 'buzzer-disabled border-4 border-slate-700'} font-cinzel font-black text-3xl uppercase text-white shadow-2xl flex flex-col items-center justify-center transition-all"
              >
                <span class="text-4xl mb-1">${isBuzzerOpen ? '⚡' : '🔒'}</span>
                <span>PULSAR</span>
              </button>
            </div>

            <div class="pb-4">
              <button onclick="localStorage.clear();location.reload();" class="text-xs text-blue-400 underline">
                Cambiar de nombre o equipo
              </button>
            </div>
          </div>
        `;

        document.getElementById('mobile-buzzer-btn')?.addEventListener('click', () => {
          if (!isBuzzerOpen) return;
          sound.playBuzz();
          if ('vibrate' in navigator) navigator.vibrate(200);

          if (fbDb) {
            const teamObj = state.teams.find(t => t.id === myTeamId);
            const accurateTimestamp = getEstimatedServerTime();

            const buzzData = {
              playerId: myId,
              playerName: myName,
              teamId: myTeamId,
              teamName: teamObj ? teamObj.name : myTeamId,
              teamColor: teamObj ? teamObj.color : '#FFCC00',
              timestamp: accurateTimestamp
            };

            const isFalseStart = state.countdownValue !== null;

            if (isFalseStart) {
              fbDb.ref('sessions/jeopardy_game').update({
                activeTurn: buzzData,
                falseStart: true,
                buzzersUnlocked: false
              });
            } else {
              fbDb.ref('sessions/jeopardy_game/activeTurn').transaction(current => {
                if (current === null) return buzzData;
                return current;
              }, (error, committed) => {
                if (!committed) {
                  fbDb.ref(`sessions/jeopardy_game/buzzQueue/${myTeamId}`).set(buzzData);
                }
              });
            }
          }
        });
      }

      render();
    })();
  </script>
</body>
</html>
